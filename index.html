<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#d7e9fb" />
    <meta name="description" content="Detour: a travel app prototype with a scripted multi-agent Scout runtime." />
    <link rel="icon" href="/assets/favicon.png" />
    <title>Detour</title>
    <style>
      /* The app paints its own backdrop; the page just gets out of the way. */
      html, body, #root { height: 100%; margin: 0; padding: 0; }
      body { background: #dfeefb; overflow: hidden; }
      #root { display: flex; }
      /* React Native Web measures text; stop the browser inflating it on rotate. */
      html { -webkit-text-size-adjust: 100%; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
